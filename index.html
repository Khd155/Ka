<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الكيمياء التفاعلي</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">

    <header class="app-header">
      <h1 class="app-title">اختبار الكيمياء التفاعلي</h1>
      <button id="darkModeToggle" class="icon-btn" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙</button>
    </header>

    <!-- شاشة البداية -->
    <section id="startScreen" class="screen active">
      <div class="card start-card">
        <h2>اختبار الكيمياء التفاعلي</h2>
        <p class="muted">اختر نمط الاختبار</p>

        <div class="start-options">
          <label class="option-row">
            <input type="checkbox" id="timerToggle">
            <span>تفعيل المؤقت (وقت محدد للاختبار)</span>
          </label>
          <div id="timerInputWrap" class="option-row hidden">
            <label for="timerMinutes">المدة بالدقائق:</label>
            <input type="number" id="timerMinutes" min="1" max="180" value="30">
          </div>
        </div>

        <div class="start-actions">
          <button id="startByChapterBtn" class="btn btn-primary">اختبار بالفصول (موصى به)</button>
          <button id="startAllBtn" class="btn btn-secondary">اختبار شامل (جميع الفصول)</button>
          <button id="resumeBtn" class="btn btn-secondary hidden">استكمال الاختبار السابق</button>
        </div>
      </div>
    </section>

    <!-- شاشة اختيار الفصول -->
    <section id="chapterScreen" class="screen">
      <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; background: linear-gradient(135deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">اختر الفصل</h2>
        <div class="chapters-grid" id="chaptersGrid"></div>
        <div style="text-align: center;">
          <button id="backFromChaptersBtn" class="btn btn-secondary">العودة</button>
        </div>
      </div>
    </section>

    <!-- شاشة السؤال -->
    <section id="quizScreen" class="screen">
      <div class="quiz-top">
        <div class="progress-info">
          <span id="questionCounter">1 من 30</span>
          <span id="timerDisplay" class="timer hidden">00:00</span>
        </div>
        <div class="progress-bar-track">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="card question-card">
        <div class="chapter-badge" id="chapterBadge"></div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="questionImageWrap" class="question-image-wrap hidden">
          <img id="questionImage" alt="صورة توضيحية للسؤال" class="question-image">
        </div>
        <div id="optionsContainer" class="options-container"></div>
      </div>

      <div class="quiz-nav">
        <button id="prevBtn" class="btn btn-secondary">السابق</button>
        <button id="finishBtn" class="btn btn-danger">إنهاء الاختبار</button>
        <button id="nextBtn" class="btn btn-primary">التالي</button>
      </div>
    </section>

    <!-- شاشة نتائج الفصل -->
    <section id="chapterResultScreen" class="screen">
      <div class="card result-card">
        <h2 id="chapterResultTitle">نتيجة الفصل</h2>
        <div class="score-circle">
          <span id="chapterScoreFraction">0 / 0</span>
          <span id="chapterScorePercent" class="score-percent">0%</span>
        </div>
        <div class="score-stats">
          <div class="stat correct">
            <span class="stat-num" id="chapterCorrectCount">0</span>
            <span class="stat-label">إجابات صحيحة</span>
          </div>
          <div class="stat wrong">
            <span class="stat-num" id="chapterWrongCount">0</span>
            <span class="stat-label">إجابات خاطئة</span>
          </div>
        </div>

        <div class="result-actions">
          <button id="nextChapterBtn" class="btn btn-primary">الفصل التالي</button>
          <button id="retakeChapterBtn" class="btn btn-secondary">إعادة هذا الفصل</button>
          <button id="backToChaptersBtn" class="btn btn-secondary">اختر فصل آخر</button>
        </div>
      </div>
    </section>

    <!-- شاشة النتائج -->
    <section id="resultScreen" class="screen">
      <div class="card result-card">
        <h2>نتيجتك النهائية</h2>
        <div class="score-circle">
          <span id="scoreFraction">0 / 0</span>
          <span id="scorePercent" class="score-percent">0%</span>
        </div>
        <div class="score-stats">
          <div class="stat correct">
            <span class="stat-num" id="correctCount">0</span>
            <span class="stat-label">إجابات صحيحة</span>
          </div>
          <div class="stat wrong">
            <span class="stat-num" id="wrongCount">0</span>
            <span class="stat-label">إجابات خاطئة</span>
          </div>
        </div>

        <div class="result-actions">
          <button id="reviewWrongBtn" class="btn btn-secondary">مراجعة الأخطاء فقط</button>
          <button id="reviewAllBtn" class="btn btn-secondary">عرض جميع الأسئلة مع الحلول</button>
          <button id="retakeBtn" class="btn btn-primary">إعادة الاختبار</button>
        </div>

        <div id="reviewContainer" class="review-container hidden"></div>
      </div>
    </section>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/quiz-logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
